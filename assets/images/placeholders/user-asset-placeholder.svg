      <stop offset="0%" stop-color="#0E4532" />
      <stop offset="60%" stop-color="#062217" />
      <stop offset="100%" stop-color="#050807" />
    </radialGradient>
  </defs>

  <rect width="800" height="520" fill="url(#phGrad)" stroke="#063D2E" stroke-width="2" />

  <!-- Dotted frame -->
  <rect x="25" y="25" width="750" height="470" rx="12" fill="none" stroke="#B6FF36" stroke-width="2" stroke-dasharray="10 10" opacity="0.6" />

