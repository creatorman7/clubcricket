  </g>

  <!-- Typography -->
  <text x="400" y="300" text-anchor="middle" font-family="'Syne', 'Outfit', sans-serif" font-weight="800" font-size="20" fill="#F7F9F5" letter-spacing="1">JSC OFFICIAL ASSET PLACEHOLDER</text>
  <text x="400" y="330" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" fill="#B6FF36">Drop your photo into: assets/images/...</text>
