  <g transform="translate(400, 210)">
    <circle cx="0" cy="0" r="45" fill="#061B13" stroke="#B6FF36" stroke-width="2.5" />
    <!-- Camera -->
    <path d="M-22 -8 L-15 -18 L15 -18 L22 -8 L28 -8 C31 -8 34 -5 34 -2 L34 20 C34 23 31 26 28 26 L-28 26 C-31 26 -34 23 -34 20 L-34 -2 C-34 -5 -31 -8 -28 -8 Z" fill="none" stroke="#F7F9F5" stroke-width="2.5" />
