<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="gNight" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#195F43" />
      <stop offset="45%" stop-color="#062217" />
      <stop offset="100%" stop-color="#050807" />
    </radialGradient>
    <linearGradient id="floodCone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B6FF36" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#061B13" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#gNight)" />
  <!-- Floodlight poles on left and right -->
  <polygon points="120,40 20,540 260,540" fill="url(#floodCone)" />
  <polygon points="680,40 540,540 780,540" fill="url(#floodCone)" />
  <!-- High intensity LEDs -->
  <g transform="translate(100, 30)">
    <rect x="-15" y="-5" width="40" height="15" rx="3" fill="#FFFFFF" />
    <circle cx="-5" cy="2" r="3.5" fill="#B6FF36" />
    <circle cx="5" cy="2" r="3.5" fill="#B6FF36" />
    <circle cx="15" cy="2" r="3.5" fill="#B6FF36" />
  </g>
  <g transform="translate(680, 30)">
    <rect x="-15" y="-5" width="40" height="15" rx="3" fill="#FFFFFF" />
    <circle cx="-5" cy="2" r="3.5" fill="#B6FF36" />
    <circle cx="5" cy="2" r="3.5" fill="#B6FF36" />
    <circle cx="15" cy="2" r="3.5" fill="#B6FF36" />
  </g>
  <!-- Illuminated Emerald Turf -->
  <polygon points="0,420 800,420 800,600 0,600" fill="#146643" stroke="#B6FF36" stroke-width="1.5" />
  <rect x="30" y="520" width="220" height="48" rx="8" fill="#061B13" fill-opacity="0.9" stroke="#B6FF36" stroke-width="1" />
  <text x="46" y="542" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#B6FF36">HIGH-LUX FLOODLIGHTS</text>
  <text x="46" y="558" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="10" fill="#F7F9F5">Night League Match Arena</text>
</svg>
