<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="gBowl" cx="40%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#144A36" />
      <stop offset="60%" stop-color="#062217" />
      <stop offset="100%" stop-color="#050807" />
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#gBowl)" />
  <!-- Laser line trajectory -->
  <line x1="200" y1="200" x2="680" y2="450" stroke="#B6FF36" stroke-width="2.5" stroke-dasharray="6 6" />
  <!-- Bowling Machine graphic center-left -->
  <g transform="translate(180, 160)">
    <rect x="-30" y="-20" width="70" height="50" rx="6" fill="#061B13" stroke="#B6FF36" stroke-width="2" />
    <circle cx="-10" cy="5" r="14" fill="#123D2B" stroke="#B6FF36" stroke-width="1.5" />
    <circle cx="20" cy="5" r="14" fill="#123D2B" stroke="#B6FF36" stroke-width="1.5" />
    <line x1="-10" y1="30" x2="-40" y2="180" stroke="#063D2E" stroke-width="6" stroke-linecap="round" />
    <line x1="15" y1="30" x2="40" y2="180" stroke="#063D2E" stroke-width="6" stroke-linecap="round" />
    <!-- Ball leaving barrel -->
    <circle cx="55" cy="5" r="9" fill="#E63946" stroke="#B6FF36" stroke-width="1.5" />
  </g>
  <!-- Speed Indicator HUD -->
  <g transform="translate(560, 120)">
    <rect width="180" height="70" rx="8" fill="#061B13" fill-opacity="0.9" stroke="#B6FF36" stroke-width="1.5" />
    <text x="16" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#B6FF36">TELEMETRY: OUTSWINGER</text>
    <text x="16" y="55" font-family="'Outfit', sans-serif" font-weight="900" font-size="22" fill="#F7F9F5">128 <tspan font-size="11" fill="#B6FF36">KMPH</tspan></text>
  </g>
  <rect x="30" y="520" width="240" height="48" rx="8" fill="#061B13" fill-opacity="0.9" stroke="#B6FF36" stroke-width="1" />
  <text x="46" y="542" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#B6FF36">BOWLING SIMULATOR</text>
  <text x="46" y="558" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="10" fill="#F7F9F5">Precision Line &amp; Length Control</text>
</svg>
