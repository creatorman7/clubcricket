<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="gTourn" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1A5E40" />
      <stop offset="60%" stop-color="#062217" />
      <stop offset="100%" stop-color="#050807" />
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#gTourn)" />
  <!-- Cheering team celebration silhouette -->
  <g transform="translate(260, 240)">
    <!-- Center captain holding trophy -->
    <path d="M110 90 L150 90 L145 180 L115 180 Z" fill="#061B13" stroke="#B6FF36" stroke-width="2" />
    <circle cx="130" cy="65" r="18" fill="#063D2E" stroke="#B6FF36" stroke-width="1.5" />
    <!-- Arms raised with trophy -->
    <line x1="115" y1="95" x2="85" y2="40" stroke="#F7F9F5" stroke-width="6" stroke-linecap="round" />
    <line x1="145" y1="95" x2="175" y2="40" stroke="#F7F9F5" stroke-width="6" stroke-linecap="round" />
    <!-- Mini Golden Cup -->
    <path d="M110 10 L150 10 L140 45 L120 45 Z" fill="#FFE885" stroke="#B6FF36" stroke-width="1.5" />
    <!-- Team members raising hands -->
    <circle cx="60" cy="90" r="14" fill="#063D2E" />
    <line x1="55" y1="110" x2="30" y2="60" stroke="#B6FF36" stroke-width="5" stroke-linecap="round" />
    <circle cx="200" cy="90" r="14" fill="#063D2E" />
    <line x1="205" y1="110" x2="230" y2="60" stroke="#B6FF36" stroke-width="5" stroke-linecap="round" />
  </g>
  <rect x="30" y="520" width="220" height="48" rx="8" fill="#061B13" fill-opacity="0.9" stroke="#B6FF36" stroke-width="1" />
  <text x="46" y="542" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#B6FF36">JSC TOURNAMENTS</text>
  <text x="46" y="558" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="10" fill="#F7F9F5">Championship Celebrations</text>
</svg>
