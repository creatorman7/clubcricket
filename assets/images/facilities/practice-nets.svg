<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <radialGradient id="netsBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0B3C2B" />
      <stop offset="60%" stop-color="#062217" />
      <stop offset="100%" stop-color="#050807" />
    </radialGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#123D2B" />
      <stop offset="100%" stop-color="#061B13" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" fill="url(#netsBg)" />

  <!-- Overhead Protective Canopy Roof -->
  <polygon points="40,20 760,20 800,120 0,120" fill="url(#roofGrad)" stroke="#063D2E" stroke-width="2" />
  <!-- Roof rafters & structural steel beams -->
  <line x1="160" y1="20" x2="140" y2="120" stroke="#B6FF36" stroke-width="2" opacity="0.6" />
  <line x1="320" y1="20" x2="310" y2="120" stroke="#B6FF36" stroke-width="2" opacity="0.6" />
  <line x1="480" y1="20" x2="490" y2="120" stroke="#B6FF36" stroke-width="2" opacity="0.6" />
  <line x1="640" y1="20" x2="660" y2="120" stroke="#B6FF36" stroke-width="2" opacity="0.6" />
  <!-- Under-roof lighting bar -->
  <line x1="60" y1="120" x2="740" y2="120" stroke="#F7F9F5" stroke-width="3" opacity="0.9" />

  <!-- Multiple Practice Net Lanes (Perspective Grid) -->
  <!-- Left Lane Net -->
  <g opacity="0.25">
    <line x1="60" y1="120" x2="20" y2="520" stroke="#F7F9F5" stroke-width="2" />
    <line x1="280" y1="120" x2="220" y2="520" stroke="#F7F9F5" stroke-width="2" />
    <!-- Horizontal net cords -->
    <line x1="50" y1="200" x2="265" y2="200" stroke="#B6FF36" stroke-dasharray="4 4" />
    <line x1="40" y1="280" x2="250" y2="280" stroke="#B6FF36" stroke-dasharray="4 4" />
    <line x1="30" y1="360" x2="235" y2="360" stroke="#B6FF36" stroke-dasharray="4 4" />
    <line x1="25" y1="440" x2="225" y2="440" stroke="#B6FF36" stroke-dasharray="4 4" />
  </g>

  <!-- Center Primary Practice Net Lane -->
  <polygon points="280,120 520,120 580,520 220,520" fill="#0A2D20" stroke="#B6FF36" stroke-width="1.5" />
  <!-- Center Pitch Mat -->
  <polygon points="340,120 460,120 490,520 310,520" fill="#285E42" stroke="#123D2B" stroke-width="1.5" />
  <!-- Batting Crease Markings -->
  <line x1="320" y1="440" x2="480" y2="440" stroke="#FFFFFF" stroke-width="3.5" />
  <line x1="325" y1="465" x2="475" y2="465" stroke="#FFFFFF" stroke-width="2.5" />
  <line x1="355" y1="180" x2="445" y2="180" stroke="#FFFFFF" stroke-width="2" />

  <!-- Stumps / Wickets in Center Net -->
  <rect x="390" y="400" width="3.5" height="42" rx="1.5" fill="#F7F9F5" />
  <rect x="398" y="400" width="3.5" height="42" rx="1.5" fill="#F7F9F5" />
  <rect x="406" y="400" width="3.5" height="42" rx="1.5" fill="#F7F9F5" />
  <rect x="388" y="398" width="23" height="3" fill="#B6FF36" />

  <!-- Right Lane Net -->
  <g opacity="0.25">
    <line x1="520" y1="120" x2="580" y2="520" stroke="#F7F9F5" stroke-width="2" />
    <line x1="740" y1="120" x2="780" y2="520" stroke="#F7F9F5" stroke-width="2" />
    <!-- Horizontal net cords -->
    <line x1="535" y1="200" x2="750" y2="200" stroke="#B6FF36" stroke-dasharray="4 4" />
    <line x1="550" y1="280" x2="760" y2="280" stroke="#B6FF36" stroke-dasharray="4 4" />
    <line x1="565" y1="360" x2="770" y2="360" stroke="#B6FF36" stroke-dasharray="4 4" />
  </g>

  <!-- Training Cones & Ball Basket -->
  <g transform="translate(250, 430)">
    <!-- Orange/Lime Training Cones -->
    <polygon points="0,20 10,0 20,20" fill="#B6FF36" stroke="#061B13" stroke-width="1" />
    <polygon points="30,22 40,2 50,22" fill="#F7F9F5" stroke="#061B13" stroke-width="1" />
  </g>

  <!-- Ball Caddy / Bucket -->
  <g transform="translate(510, 420)">
    <polygon points="0,0 30,0 25,35 5,35" fill="#061B13" stroke="#B6FF36" stroke-width="2" />
    <circle cx="8" cy="-4" r="5" fill="#E63946" />
    <circle cx="16" cy="-6" r="5" fill="#E63946" />
    <circle cx="23" cy="-4" r="5" fill="#E63946" />
    <circle cx="12" cy="5" r="5" fill="#E63946" />
    <circle cx="20" cy="5" r="5" fill="#E63946" />
  </g>

  <!-- Floating Glass Telemetry Card Overlay inside graphic -->
  <g transform="translate(40, 400)">
    <rect width="210" height="85" rx="10" fill="#061B13" fill-opacity="0.85" stroke="#B6FF36" stroke-width="1.2" />
    <text x="16" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#B6FF36" letter-spacing="1.5">COVERED NETS</text>
    <text x="16" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" fill="#F7F9F5">All-Weather Protected Nets</text>
    <text x="16" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#A5C4B4">Pace &amp; Spin Training Lanes</text>
    <circle cx="185" cy="24" r="5" fill="#B6FF36" />
  </g>
</svg>
