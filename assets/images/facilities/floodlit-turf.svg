<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <radialGradient id="turfNight" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0E4532" />
      <stop offset="50%" stop-color="#062217" />
      <stop offset="100%" stop-color="#050807" />
    </radialGradient>
    <linearGradient id="turfGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#125E3F" />
      <stop offset="50%" stop-color="#0B402B" />
      <stop offset="100%" stop-color="#062418" />
    </linearGradient>
    <linearGradient id="floodGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B6FF36" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#061B13" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Sky & Night Atmosphere -->
  <rect width="800" height="520" fill="url(#turfNight)" />

  <!-- Stadium Floodlight Beams -->
  <polygon points="120,40 0,420 320,420" fill="url(#floodGlow)" opacity="0.6" />
  <polygon points="680,40 480,420 800,420" fill="url(#floodGlow)" opacity="0.6" />

  <!-- Floodlight Towers -->
  <!-- Left Tower -->
  <g transform="translate(110, 30)">
    <rect x="-18" y="-6" width="36" height="12" rx="3" fill="#F7F9F5" />
    <circle cx="-10" cy="0" r="4" fill="#B6FF36" />
    <circle cx="0" cy="0" r="4" fill="#B6FF36" />
    <circle cx="10" cy="0" r="4" fill="#B6FF36" />
    <line x1="0" y1="6" x2="0" y2="150" stroke="#123D2B" stroke-width="4" />
  </g>
  <!-- Right Tower -->
  <g transform="translate(690, 30)">
    <rect x="-18" y="-6" width="36" height="12" rx="3" fill="#F7F9F5" />
    <circle cx="-10" cy="0" r="4" fill="#B6FF36" />
    <circle cx="0" cy="0" r="4" fill="#B6FF36" />
    <circle cx="10" cy="0" r="4" fill="#B6FF36" />
    <line x1="0" y1="6" x2="0" y2="150" stroke="#123D2B" stroke-width="4" />
  </g>

  <!-- Boundary Netting Mesh in Background -->
  <g opacity="0.15">
    <rect x="60" y="140" width="680" height="160" fill="none" stroke="#B6FF36" stroke-width="1.5" />
    <line x1="60" y1="180" x2="740" y2="180" stroke="#B6FF36" />
    <line x1="60" y1="220" x2="740" y2="220" stroke="#B6FF36" />
    <line x1="60" y1="260" x2="740" y2="260" stroke="#B6FF36" />
    <!-- Vertical wire supports -->
    <line x1="160" y1="140" x2="160" y2="300" stroke="#F7F9F5" stroke-width="2" />
    <line x1="300" y1="140" x2="300" y2="300" stroke="#F7F9F5" stroke-width="2" />
    <line x1="500" y1="140" x2="500" y2="300" stroke="#F7F9F5" stroke-width="2" />
    <line x1="640" y1="140" x2="640" y2="300" stroke="#F7F9F5" stroke-width="2" />
  </g>

  <!-- Main All-Weather Cricket Turf Ground (Perspective) -->
  <polygon points="60,280 740,280 840,520 -40,520" fill="url(#turfGreen)" />

  <!-- Alternating Turf Mowing Stripes -->
  <polygon points="120,280 180,280 200,520 110,520" fill="#146946" opacity="0.4" />
  <polygon points="260,280 320,280 370,520 280,520" fill="#146946" opacity="0.4" />
  <polygon points="420,280 480,280 550,520 460,520" fill="#146946" opacity="0.4" />
  <polygon points="560,280 620,280 710,520 620,520" fill="#146946" opacity="0.4" />

  <!-- Central Cricket Pitch Strip -->
  <polygon points="360,280 440,280 470,520 330,520" fill="#C2A878" stroke="#061B13" stroke-width="1.5" />
  <!-- Pitch Crease Lines -->
  <!-- Bowling Crease far -->
  <line x1="365" y1="310" x2="435" y2="310" stroke="#FFFFFF" stroke-width="2" />
  <!-- Popping Crease near -->
  <line x1="340" y1="460" x2="460" y2="460" stroke="#FFFFFF" stroke-width="3" />
  <line x1="345" y1="480" x2="455" y2="480" stroke="#FFFFFF" stroke-width="2.5" />

  <!-- Stumps / Wickets near end -->
  <rect x="390" y="420" width="3" height="40" rx="1.5" fill="#F7F9F5" />
  <rect x="398.5" y="420" width="3" height="40" rx="1.5" fill="#F7F9F5" />
  <rect x="407" y="420" width="3" height="40" rx="1.5" fill="#F7F9F5" />
  <rect x="388" y="418" width="24" height="2.5" fill="#B6FF36" />

  <!-- Distant Stumps -->
  <rect x="396" y="295" width="2" height="15" fill="#F7F9F5" />
  <rect x="400" y="295" width="2" height="15" fill="#F7F9F5" />
  <rect x="404" y="295" width="2" height="15" fill="#F7F9F5" />
  <rect x="395" y="294" width="12" height="1.5" fill="#B6FF36" />

  <!-- Floating Glass Telemetry Card Overlay inside graphic -->
  <g transform="translate(40, 400)">
    <rect width="210" height="85" rx="10" fill="#061B13" fill-opacity="0.85" stroke="#B6FF36" stroke-width="1.2" />
    <text x="16" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#B6FF36" letter-spacing="1.5">FLOODLIT TURF</text>
    <text x="16" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" fill="#F7F9F5">All-Weather Playing Surface</text>
    <text x="16" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#A5C4B4">Day &amp; High-Lux Night Play</text>
    <circle cx="185" cy="24" r="5" fill="#B6FF36" />
  </g>
</svg>
