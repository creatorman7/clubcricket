<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <radialGradient id="trophyBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#144A36" />
      <stop offset="55%" stop-color="#062217" />
      <stop offset="100%" stop-color="#050807" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="50%" stop-color="#E2B13C" />
      <stop offset="100%" stop-color="#9A7016" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="520" fill="url(#trophyBg)" />

  <!-- Celebration Confetti / Sparkles in Lime and Gold -->
  <g opacity="0.6">
    <circle cx="140" cy="120" r="3" fill="#B6FF36" />
    <circle cx="210" cy="80" r="4" fill="#FFE885" />
    <circle cx="320" cy="90" r="2.5" fill="#F7F9F5" />
    <circle cx="480" cy="85" r="3.5" fill="#FFE885" />
    <circle cx="620" cy="110" r="4" fill="#B6FF36" />
    <circle cx="680" cy="160" r="2.5" fill="#F7F9F5" />
    <polygon points="180,180 185,188 175,186" fill="#B6FF36" />
    <polygon points="580,150 588,155 582,162" fill="#FFE885" />
    <polygon points="280,150 285,155 281,162" fill="#F7F9F5" />
    <polygon points="510,180 518,175 514,188" fill="#B6FF36" />
  </g>

  <!-- Massive Golden & Emerald Championship Trophy in Center -->
  <g transform="translate(320, 100)" filter="url(#goldGlow)">
    <!-- Base Plinth -->
    <polygon points="10,260 150,260 140,290 20,290" fill="#061B13" stroke="#B6FF36" stroke-width="2" />
    <rect x="25" y="235" width="110" height="25" rx="3" fill="#0A281B" stroke="#063D2E" stroke-width="1.5" />
    <text x="42" y="252" font-family="'Outfit', sans-serif" font-weight="900" font-size="11" fill="#B6FF36" letter-spacing="1">JSC CUP</text>

    <!-- Trophy Stem -->
    <path d="M70 235 L70 180 L90 180 L90 235 Z" fill="url(#goldGrad)" />
    <circle cx="80" cy="190" r="14" fill="#063D2E" stroke="#FFE885" stroke-width="2" />

    <!-- Main Cup Body -->
    <path d="M40 80 Q 40 180, 80 180 Q 120 180, 120 80 Z" fill="url(#goldGrad)" stroke="#FFE885" stroke-width="1.5" />

    <!-- Left Handle -->
    <path d="M40 90 C 0 90, 0 150, 50 155" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
    <!-- Right Handle -->
    <path d="M120 90 C 160 90, 160 150, 110 155" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />

    <!-- Crown / Top Finial with Cricket Ball -->
    <ellipse cx="80" cy="80" rx="40" ry="8" fill="#FFE885" />
    <circle cx="80" cy="55" r="14" fill="#E63946" stroke="#FFE885" stroke-width="2" />
    <path d="M72 48 Q 80 55 72 62" stroke="#FFFFFF" stroke-width="1.5" fill="none" />
  </g>

  <!-- Floating Glass Telemetry Card Overlay -->
  <g transform="translate(40, 400)">
    <rect width="250" height="85" rx="10" fill="#061B13" fill-opacity="0.85" stroke="#B6FF36" stroke-width="1.2" />
    <text x="16" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#B6FF36" letter-spacing="1.5">TOURNAMENTS &amp; EVENTS</text>
    <text x="16" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" fill="#F7F9F5">Night Box Cricket Leagues</text>
    <text x="16" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#A5C4B4">Inter-Club Matches &amp; Youth Trials</text>
    <circle cx="225" cy="24" r="5" fill="#B6FF36" />
  </g>
</svg>
