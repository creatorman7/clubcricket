<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <radialGradient id="acadBg" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0E4532" />
      <stop offset="60%" stop-color="#062217" />
      <stop offset="100%" stop-color="#050807" />
    </radialGradient>
  </defs>

  <rect width="800" height="520" fill="url(#acadBg)" />

  <!-- Stadium Floodlight Beams -->
  <polygon points="400,20 100,520 700,520" fill="#B6FF36" opacity="0.08" />

  <!-- Cricket Pitch & Practice Area Ground -->
  <polygon points="40,360 760,360 820,520 -20,520" fill="#0A2D20" stroke="#063D2E" stroke-width="2" />
  <polygon points="260,360 540,360 590,520 210,520" fill="#185E3E" />

  <!-- Senior Coach (Left) guiding a young player -->
  <g transform="translate(240, 210)">
    <!-- Coach Torso with JSC Staff Jersey -->
    <path d="M40 70 L90 70 L85 150 L35 150 Z" fill="#061B13" stroke="#B6FF36" stroke-width="1.5" />
    <text x="44" y="95" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="9" fill="#B6FF36">COACH</text>
    <!-- Head & Cap -->
    <circle cx="65" cy="45" r="18" fill="#063D2E" />
    <path d="M50 40 L85 36 L75 28 Z" fill="#B6FF36" />
    <!-- Arms pointing & demonstrating grip -->
    <path d="M40 75 L10 110 L45 130" stroke="#061B13" stroke-width="8" stroke-linecap="round" fill="none" />
    <path d="M90 75 L125 95 L145 110" stroke="#B6FF36" stroke-width="5" stroke-linecap="round" fill="none" />
    <!-- Trackpants & Shoes -->
    <line x1="48" y1="150" x2="42" y2="210" stroke="#123D2B" stroke-width="10" stroke-linecap="round" />
    <line x1="72" y1="150" x2="78" y2="210" stroke="#123D2B" stroke-width="10" stroke-linecap="round" />
    <rect x="30" y="205" width="22" height="10" rx="3" fill="#F7F9F5" />
    <rect x="72" y="205" width="22" height="10" rx="3" fill="#F7F9F5" />
  </g>

  <!-- Junior Cricketer in Full Batting Stance (Center-Right) -->
  <g transform="translate(420, 240)">
    <!-- Pads & Guards -->
    <rect x="30" y="110" width="18" height="60" rx="4" fill="#F7F9F5" stroke="#061B13" stroke-width="1.5" />
    <rect x="55" y="110" width="18" height="60" rx="4" fill="#F7F9F5" stroke="#061B13" stroke-width="1.5" />
    <!-- Junior Jersey -->
    <path d="M28 50 L75 50 L70 115 L25 115 Z" fill="#063D2E" stroke="#B6FF36" stroke-width="1.5" />
    <text x="35" y="75" font-family="'Outfit', sans-serif" font-weight="900" font-size="9" fill="#B6FF36">JSC</text>
    <!-- Helmet -->
    <circle cx="50" cy="30" r="16" fill="#0A281B" stroke="#B6FF36" stroke-width="1.5" />
    <line x1="42" y1="36" x2="62" y2="36" stroke="#F7F9F5" stroke-width="1.5" />
    <!-- Bat held in orthodox forward defensive stance -->
    <line x1="48" y1="75" x2="35" y2="160" stroke="#EAD7B2" stroke-width="5.5" stroke-linecap="round" />
  </g>

  <!-- Stumps Behind Junior Player -->
  <g transform="translate(540, 310)">
    <rect x="0" y="0" width="3" height="42" rx="1.5" fill="#F7F9F5" />
    <rect x="8" y="0" width="3" height="42" rx="1.5" fill="#F7F9F5" />
    <rect x="16" y="0" width="3" height="42" rx="1.5" fill="#F7F9F5" />
    <rect x="-2" y="-2" width="23" height="3" fill="#B6FF36" />
  </g>

  <!-- Floating Glass Telemetry Card Overlay -->
  <g transform="translate(40, 400)">
    <rect width="240" height="85" rx="10" fill="#061B13" fill-opacity="0.85" stroke="#B6FF36" stroke-width="1.2" />
    <text x="16" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#B6FF36" letter-spacing="1.5">JSC CRICKET ACADEMY</text>
    <text x="16" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" fill="#F7F9F5">Junior &amp; Senior Batches</text>
    <text x="16" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#A5C4B4">Technical Drills &amp; Match Simulation</text>
    <circle cx="215" cy="24" r="5" fill="#B6FF36" />
  </g>
</svg>
