<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="jscGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B6FF36" />
      <stop offset="100%" stop-color="#063D2E" />
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B6FF36" />
      <stop offset="100%" stop-color="#80D600" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Shield Outer -->
  <polygon points="50,4 92,25 92,75 50,96 8,75 8,25" fill="#061B13" stroke="#B6FF36" stroke-width="2.5" stroke-linejoin="round" />
  <!-- Inner subtle shield border -->
  <polygon points="50,11 85,29 85,71 50,89 15,71 15,29" fill="#0A281B" stroke="#063D2E" stroke-width="1.5" />

  <!-- Cricket Wickets / Stumps in background -->
  <rect x="42" y="26" width="3" height="28" rx="1.5" fill="#123D2B" />
  <rect x="48.5" y="24" width="3" height="30" rx="1.5" fill="#B6FF36" opacity="0.8" />
  <rect x="55" y="26" width="3" height="28" rx="1.5" fill="#123D2B" />
  <rect x="40" y="23" width="20" height="2" rx="1" fill="#B6FF36" opacity="0.9" />

  <!-- Dynamic Angular JSC Monogram -->
  <path d="M30 46 L44 46 L36 68 C34 73 26 73 22 69" stroke="#F7F9F5" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M60 48 C55 45 46 47 46 53 C46 60 56 60 56 67 C56 73 47 75 42 71" stroke="#B6FF36" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)" />
  <path d="M78 50 C74 46 66 46 63 50 C58 56 58 64 63 70 C67 74 76 74 80 68" stroke="#F7F9F5" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Red Cricket Ball with Seam -->
  <circle cx="76" cy="30" r="8" fill="#E63946" stroke="#B6FF36" stroke-width="1.2" />
  <path d="M72 26 Q76 30 72 34" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="1 1" fill="none" />
</svg>
